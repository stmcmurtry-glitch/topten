name: Monthly Stats Update Reminder

on:
  schedule:
    # Runs at 9am UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  create-reminder-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Parse stats lists and create issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Parse featuredLists.ts to extract all lists with updatedAt set.
            // Reads: id, title, statsSource, updatedAt — no TypeScript compiler needed.
            const src = fs.readFileSync('src/data/featuredLists.ts', 'utf8');

            const lists = [];
            // Split on top-level object boundaries inside FEATURED_LISTS
            const blocks = src.split(/\n  \{/);
            for (const block of blocks) {
              const id        = (block.match(/id:\s*'([^']+)'/)          || [])[1];
              const title     = (block.match(/title:\s*'([^']+)'/)       || [])[1];
              const source    = (block.match(/statsSource:\s*'([^']+)'/) || [])[1];
              const updatedAt = (block.match(/updatedAt:\s*'([^']+)'/)   || [])[1];
              if (id && title && updatedAt) {
                lists.push({ id, title, source: source || null });
              }
            }

            if (lists.length === 0) {
              console.log('No stats lists found — skipping issue creation.');
              return;
            }

            const today = new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            // Group by source domain for a cleaner issue layout
            const byDomain = {};
            for (const list of lists) {
              let domain = 'No source set';
              if (list.source) {
                try { domain = new URL(list.source).hostname.replace('www.', ''); } catch {}
              }
              if (!byDomain[domain]) byDomain[domain] = [];
              byDomain[domain].push(list);
            }

            const sections = Object.entries(byDomain).map(([domain, items]) => {
              const rows = items.map(l => {
                const link = l.source ? `[${l.source}](${l.source})` : '_no source_';
                return `- [ ] **${l.id}** ${l.title}\n  Source: ${link}`;
              }).join('\n');
              return `### ${domain}\n${rows}`;
            }).join('\n\n');

            const body = `
            ## Monthly Stats Update — ${today}

            The following **${lists.length} lists** in \`src/data/featuredLists.ts\` have an \`updatedAt\` field and need to be verified.
            Check each against its source URL, correct any numbers, then bump all \`updatedAt\` fields to \`'${today}'\`.

            ${sections}

            ---

            ### After updating
            1. Fix any incorrect numbers in \`src/data/featuredLists.ts\`
            2. Set all \`updatedAt\` fields to \`'${today}'\`
            3. Commit: \`Update stats lists — ${today}\`

            > **New stats list?** Add \`updatedAt\` and \`statsSource\` fields to any new factual list in \`featuredLists.ts\` and it will automatically appear here next month.
            `.replace(/^ {12}/gm, '').trim();

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Monthly Stats Update — ${today} (${lists.length} lists)`,
              body,
              labels: ['stats-update'],
            });

            console.log(`Created issue for ${lists.length} stats lists.`);
